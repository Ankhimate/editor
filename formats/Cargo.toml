[package]
name = "ankhimate-formats"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ankhimate/formats"
authors = ["Ankhimate Contributors"]

[dependencies]
ankhimate-core = { version = "0.1.0", git = "https://github.com/Ankhimate/core", rev = "82d4490d08e2f56298abdf1b4692bb8593c048f9" }
glam = { version = "0.33.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# PSD import (T-302) crops layers and re-encodes them as PNG.
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0"
psd = "0.3.5"

[dev-dependencies]
tempfile = "3"
