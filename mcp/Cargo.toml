[package]
name = "ankhimate-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Model Context Protocol server for Ankhimate rigs"

[dependencies]
ankhimate-core = { version = "0.1.0", path = "../core" }
ankhimate-document = { version = "0.1.0", path = "../document" }
ankhimate-formats = { version = "0.1.0", path = "../formats" }
ankhimate-export = { version = "0.1.0", path = "../export" }
ankhimate-plugins = { version = "0.1.0", path = "../plugins", features = ["import-spine", "import-dragonbones"] }
ankhimate-render = { version = "0.1.0", path = "../render" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.24.0"
