[package]
name = "ankhimate-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "JavaScript plugin host: the document API, bound to QuickJS."

[dependencies]
ankhimate-core = { version = "0.1.0", path = "../core" }
ankhimate-document = { version = "0.1.0", path = "../document" }
