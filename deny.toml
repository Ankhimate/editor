# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# RUSTSEC IDs we currently tolerate (remove as they are addressed).
ignore = []

[licenses]
# Ankhimate is dual MIT OR Apache-2.0. Allow permissive licenses only so the
# "embed the runtime in any game" promise (ARCHITECTURE_PLAN §0) holds.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla Public License — file-level, weak copyleft; MPL deps do not taint consumers.
    "MPL-2.0",
]
# Confidence threshold for license expression parsing.
confidence-threshold = 0.93

[bans]
# Disallow multiple versions of the same crate where possible.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
