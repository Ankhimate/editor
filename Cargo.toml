[workspace]
members = [
    "core",
    "document",
    "formats",
    "export",
    "plugins",
    "render",
    "editor",
    "mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ankhimate/editor"
authors = ["Ankhimate Contributors"]

[profile.dev.package."*"]
opt-level = 1
debug = false
