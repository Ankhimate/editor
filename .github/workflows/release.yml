name: Release

# Tag a commit to ship it:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds the editor for Windows and Linux, packages each with the licences and
# README, and attaches both to a GitHub release. `workflow_dispatch` builds the
# same artifacts without publishing, for checking a release before tagging one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ankhimate-editor
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ankhimate-editor.exe
    steps:
      - uses: actions/checkout@v4

      # egui/wgpu links against X11, Wayland and xkbcommon, and the file dialog
      # against GTK. None of these are on the runner image by default.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --locked: a release must build from the committed Cargo.lock, not from
      # whatever resolved that morning.
      - name: Build
        run: cargo build --release --locked -p ankhimate-editor --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          staging="ankhimate-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "ankhimate-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $staging
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only a tag publishes. A manual run stops at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          body: |
            > **Pre-alpha.** The `.ankh` format is not frozen and export is
            > unfinished — expect to re-rig between releases.

            Download the archive for your platform, unpack it, and run
            `ankhimate-editor`. Requires a GPU with Vulkan, DX12, Metal, or GL.
